# NOTE: authorized_keys public-key bodies are REDACTED for this public repo.
# The real profile lives on lxd110maas (http://10.42.0.3/maas/config/lxd/corrprofile.yaml)
# and in the DR mirror at /dataz/dsa110/dr_archive/lxd110maas-artifacts/.
config:
  boot.autostart: true
  limits.kernel.memlock: "10000000000"
  user.user-data: |
    #cloud-config
    ssh_authorized_keys:
      - ssh-ed25519 __REDACTED_PUBKEY__ rh@birch
      - ssh-rsa __REDACTED_PUBKEY__ vikram@ironbark.caltech.edu
      - ssh-rsa __REDACTED_PUBKEY__ dana@rhaenys.local
      - ssh-ed25519 __REDACTED_PUBKEY__ nitika@penelope
      - ssh-rsa __REDACTED_PUBKEY__ rsa-key-20190102
      - ssh-rsa __REDACTED_PUBKEY__ kp@castor
      - ssh-rsa __REDACTED_PUBKEY__ greg@greg-PC
      - ssh-rsa __REDACTED_PUBKEY__ claw@gygax
      - ssh-ed25519 __REDACTED_PUBKEY__ gechen@dhcp-193-198.caltech.edu
      - ssh-ed25519 __REDACTED_PUBKEY__ user@dsa-storage
      - ssh-ed25519 __REDACTED_PUBKEY__ its\lamb@Avon
      - ssh-ed25519 __REDACTED_PUBKEY__ msmoot
    package_upgrade: true
    packages:
      - emacs24-nox
      - gnupg-curl
      - ssh
      - myrepos
      - make
      - autoconf
      - autotools-dev
      - libtool
      - pkg-config
      - csh
      - gcc
      - g++
      - gfortran
      - libnuma-dev
      - syslog-ng
      - libtool-bin
      - libboost-all-dev
      - xorg
    timezone: UTC
    runcmd:
      - [wget, "http://10.42.0.3/maas/config/tarballs/cuda-ubuntu1604.pin"]
      - [mv, cuda-ubuntu1604.pin, /etc/apt/preferences.d/cuda-repository-pin-600]
      - [wget, "http://10.42.0.3/maas/config/tarballs/cuda-repo-ubuntu1604-11-1-local_11.1.0-455.23.05-1_amd64.deb"]
      - [dpkg, "-i", "cuda-repo-ubuntu1604-11-1-local_11.1.0-455.23.05-1_amd64.deb"]
      - [apt-key, add, "/var/cuda-repo-ubuntu1604-11-1-local/7fa2af80.pub"]
      - [apt-get, update]
      - [apt-get, -y, install, cuda]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/sysctl/set_sysctl"]
      - [chmod, 755, set_sysctl]
      - [/bin/bash, /set_sysctl]
      - [mkdir, "-p", /home/ubuntu/proj]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_tarballs"]
      - [chmod, 755, /install_tarballs]
      - [/install_tarballs]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_anaconda3"]
      - [chmod, 755, /install_anaconda3]
      - [/install_anaconda3]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/create_conda_py36"]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/dsaenv01.yaml"] 
      - [chmod, 755, /create_conda_py36]
      - [/create_conda_py36]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/homedirfiles/.bashrc_corr"]
      - [mv, ".bashrc_corr", "/home/ubuntu/.bashrc"]
      - [chown, "-R", "ubuntu:ubuntu", "/home/ubuntu"]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_repos_c"]
      - [chmod, 755, /install_repos_c]
      - [/install_repos_c]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_repos_py36"]
      - [chmod, 755, /install_repos_py36]
      - [su, "-", "ubuntu", "-c", "/install_repos_py36"]
      - [mkdir, "-p", "/home/ubuntu/tmp"]
      - [mkdir, "-p", "/home/ubuntu/data"]
      - [chown, "-R", "ubuntu:ubuntu", "/home/ubuntu"]

description: Put container on sas.pvt(10.41.0.0/24) network
devices:
  X0:
    bind: container
    connect: unix:@/tmp/.X11-unix/X1
    listen: unix:@/tmp/.X11-unix/X0
    security.gid: "1000"
    security.uid: "1000"
    type: proxy
  eth0:
    maas.subnet.ipv4: sas.pvt
    name: eth0
    nictype: bridged
    parent: br2
    type: nic
#  eth1:
#    maas.subnet.ipv4: pro.pvt
#    name: eth1
#    nictype: bridged
#    parent: br1
#    type: nic
  gpu:
    type: gpu
  root:
    path: /
    pool: local
    type: disk
name: corr
