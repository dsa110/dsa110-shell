      - [mkdir, "-p", /home/ubuntu/proj]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_tarballs"]
      - [chmod, 755, /install_tarballs]
      - [/install_tarballs]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_anaconda3"]
      - [chmod, 755, /install_anaconda3]
      - [/install_anaconda3]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/create_conda_py36"]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/dsaenv01.yaml"] 
      - [chmod, 755, /create_conda_py36]
      - [/create_conda_py36]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/homedirfiles/.bashrc_corr"]
      - [mv, ".bashrc_corr", "/home/ubuntu/.bashrc"]
      - [chown, "-R", "ubuntu:ubuntu", "/home/ubuntu"]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_repos_c"]
      - [chmod, 755, /install_repos_c]
      - [/install_repos_c]
      - [wget, "--no-check-certificate", "http://10.42.0.3/maas/config/lxd/install_repos_py36"]
      - [chmod, 755, /install_repos_py36]
      - [su, "-", "ubuntu", "-c", "/install_repos_py36"]
      - [mkdir, "-p", "/home/ubuntu/tmp"]
      - [mkdir, "-p", "/home/ubuntu/data"]
      - [chown, "-R", "ubuntu:ubuntu", "/home/ubuntu"]

description: Put container on sas.pvt(10.41.0.0/24) network
devices:
  X0:
    bind: container
    connect: unix:@/tmp/.X11-unix/X1
    listen: unix:@/tmp/.X11-unix/X0
    security.gid: "1000"
    security.uid: "1000"
    type: proxy
  eth0:
    maas.subnet.ipv4: sas.pvt
    name: eth0
    nictype: bridged
    parent: br2
    type: nic
#  eth1:
#    maas.subnet.ipv4: pro.pvt
#    name: eth1
#    nictype: bridged
#    parent: br1
#    type: nic
  gpu:
    type: gpu
  root:
    path: /
    pool: local
    type: disk
name: corr
used_by:
