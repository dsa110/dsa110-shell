# config file for etcd2db
#
# Corrected 2026-07-30: influxurl was "http://influxdbservice:8086", a bare
# hostname that expanded via `search sas.pvt` to influxdbservice.sas.pvt and
# resolved to nothing (see etcdConfig.yml for the full explanation).  etcd2db
# and influxd share this host, so loopback is correct.

influxurl: "http://127.0.0.1:8086"
influxdbname: "dsa110"
monmap:
  /mon/ant:
    tablename: "antmon"
    tagnames:
      - "ant_num"
  # Added 2026-07-31.  /mon/beb was NOT in the container-era monmap, so the 120
  # back-end-box monitor points (if_pwr_a/b, beb_temp, lo_mon, pd_current_a/b,
  # psu_*, beb_current_a/b) were being published to etcd by hwmc and then thrown
  # away -- nothing ever reached InfluxDB, so no BEB panel could work.
  # The payload carries ant_num, so tagging on it makes bebmon joinable with
  # antmon on the same antenna.
  /mon/beb:
    tablename: "bebmon"
    tagnames:
      - "ant_num"
  /mon/cal:
    tablename: "calmon"
    tagnames:
      - "ant_num"
      - "pol"
      - "calsource"
  /mon/wx:
    tablename: "wxmon"
    tagnames:
