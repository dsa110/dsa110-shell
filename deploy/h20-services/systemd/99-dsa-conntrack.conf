# Conntrack headroom for h20. See dsa-snap-notrack.service for why the table
# fills at all: Docker pulls in connection tracking, and 32 snap.py instances
# doing TFTP register reads create entries faster than the 30 s UDP timeout
# retires them. The NOTRACK rules are the real fix; this is headroom so a burst
# elsewhere cannot wedge etcd connections again.
net.netfilter.nf_conntrack_max = 1048576
# Retire idle UDP flows faster -- TFTP transfers are short and never resumed.
net.netfilter.nf_conntrack_udp_timeout = 10
net.netfilter.nf_conntrack_udp_timeout_stream = 60
